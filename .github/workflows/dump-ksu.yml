name: Dump KernelSU Submodule

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dump-kernelsu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dump:
    if: github.ref_type == 'branch' || true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [main, main-susfs]

    env:
      TARGET_BRANCH: ${{ matrix.branch }}
      UPDATE_MESSAGE: 'chore: dump KernelSU submodule to latest [skip ci]'
      BOT_EMAIL: 'github-actions[bot]@users.noreply.github.com'

    steps:
      - name: Checkout parent repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "$BOT_EMAIL"

      - name: Update KernelSU and commit if changed
        shell: bash
        run: |
          set -euo pipefail

          original_head=$(git rev-parse HEAD)
          current_ksu=$(git rev-parse HEAD:KernelSU)

          git submodule update --init --remote --checkout -- KernelSU
          upstream_ksu=$(git -C KernelSU rev-parse HEAD)

          if [[ "$current_ksu" == "$upstream_ksu" ]]; then
            echo "KernelSU already up to date on branch ${{ matrix.branch }}, nothing to commit."
            exit 0
          fi

          git add -- KernelSU

          last_subject=$(git log -1 --format=%s)
          last_author=$(git log -1 --format=%ae)

          if [[ "$last_subject" == "$UPDATE_MESSAGE" && "$last_author" == "$BOT_EMAIL" ]]; then
            echo "Amending the previous KernelSU update commit on branch ${{ matrix.branch }}."
            git commit --amend --no-edit --reset-author
            git push \
              --force-with-lease="refs/heads/$TARGET_BRANCH:$original_head" \
              origin "HEAD:refs/heads/$TARGET_BRANCH"
          else
            echo "Creating a new KernelSU update commit on branch ${{ matrix.branch }}."
            git commit -m "$UPDATE_MESSAGE"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
