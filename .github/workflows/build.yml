name: Build Cancro Kernel

on:
  schedule:
    - cron: '0 22 * * *'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          
      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache unzip
          ccache --version
          
      - name: Download & extract Linaro GCC 4.9.4 toolchain
        run: |
          mkdir -p /opt/toolchain
          cd /opt/toolchain
          curl -L --fail --connect-timeout 30 --max-time 300 \
            https://github.com/Cancro-SU-Lab/many-gcc/releases/download/aosp-4.9/aosp-4.9.zip \
            -o gcc.zip        
          unzip gcc.zip
          /opt/toolchain/aosp-4.9/bin/arm-linux-androideabi-gcc --version

      - name: Export build environment
        run: |
          echo "ARCH=arm" >> $GITHUB_ENV
          echo "CROSS_COMPILE=ccache /opt/toolchain/aosp-4.9/bin/arm-linux-androideabi-" >> $GITHUB_ENV
          echo "/opt/toolchain/aosp-4.9/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          arm-linux-androideabi-gcc --version | head -n1

      - name: Generate defconfig
        run: |
          make cancro_user_defconfig

      - name: Build kernel
        run: |
          make HOSTCFLAGS="-fcommon" LOCALVERSION="-PowerBy_Cancro-SU-Lab_${{ github.run_number }}" -j$(nproc)
          
      - name: Verify zImage
        run: |
          ls -lh arch/arm/boot/zImage

      - name: Clone AnyKernel3 and package zip
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3
          cp arch/arm/boot/zImage anykernel3/zImage
          cp scripts/anykernel.sh anykernel3/anykernel.sh
          cd anykernel3
          rm -rf .git .github README.md LICENSE
          mkdir -p ../out
          ZIP_NAME="cancro-kernel-${{ github.run_number }}.zip"
          zip -r ../out/${ZIP_NAME} . -x ".*" -x "__MACOSX/*"
          cd ..
          cp arch/arm/boot/zImage out/
          echo "---" > out/version.txt
          echo "Kernel built at $(date)" >> out/version.txt
          echo "KernelSU commit: $(git -C KernelSU rev-parse --short HEAD)" >> out/version.txt
          echo "---" >> out/version.txt
          cat out/version.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cancro-kernel-${{ github.run_number }}
          path: out/
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            .config
            build.log
          retention-days: 7
